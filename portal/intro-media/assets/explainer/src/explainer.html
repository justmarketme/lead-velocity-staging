<!doctype html><html lang="en-ZA"><meta charset="utf8"><title>Step explainer frame (code-rendered from brand tokens)</title>
<link rel="stylesheet" href="../../../../../brand/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{position:relative;overflow:hidden;background:var(--sm-charcoal);color:var(--sm-off-white);font-family:var(--sm-font);font-weight:500;-webkit-font-smoothing:antialiased;line-height:1.2}
:root{--hx:72px;--hy:250px;--hs:72px;--cy:1380px;--cs:50px;--py:560px;--pscale:1;--ph:760px}
body.r1x1{--hx:60px;--hy:48px;--hs:52px;--cy:872px;--cs:40px;--py:262px;--pscale:.70}
.hd{position:absolute;left:var(--hx);right:var(--hx);top:var(--hy);font-weight:800;letter-spacing:-.015em;line-height:1.06;font-size:var(--hs)}
.hd em{font-style:normal;color:var(--sm-amber)}
.stage{position:absolute;left:0;right:0;top:var(--py);display:grid;justify-items:center}
.cap{position:absolute;left:48px;right:48px;top:var(--cy);display:flex;justify-content:center}
.cap span{background:var(--sm-scrim);padding:18px 30px;border-radius:24px;font-size:var(--cs);line-height:1.22;text-align:center;color:#fff;max-width:100%}
.panel{width:780px;height:var(--ph);background:var(--sm-off-white);color:var(--sm-charcoal);border-radius:40px;padding:44px;position:relative;transform:scale(var(--pscale));transform-origin:top center;display:flex;flex-direction:column;gap:22px}
.tag{position:absolute;top:22px;right:28px;background:var(--sm-charcoal);color:var(--sm-off-white);font-size:22px;font-weight:800;padding:6px 16px;border-radius:99px;letter-spacing:.04em}
.k{font-size:26px;color:var(--sm-muted);font-weight:800;letter-spacing:.03em}
.h2{font-size:50px;font-weight:800;line-height:1.08;letter-spacing:-.015em}
.row{display:flex;gap:20px;align-items:flex-start;background:#fff;border:2px solid var(--sm-rule);border-radius:24px;padding:22px 26px}
.row b{display:block;font-size:34px;font-weight:800}.row small{display:block;font-size:26px;color:var(--sm-muted);margin-top:4px}
.tick{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sm-amber);display:grid;place-items:center;margin-top:2px}
.tick svg{width:30px;height:30px}
.bar{height:20px;border-radius:10px;background:var(--sm-rule)}
.card{border:3px solid var(--sm-rule);border-radius:24px;padding:24px 28px;background:#fff;display:flex;flex-direction:column;gap:12px}
.card.sel{border-color:var(--sm-amber);box-shadow:0 0 0 6px rgb(245 166 35 / .25)}
.card .t{font-size:28px;font-weight:800}
.btn{display:inline-flex;background:var(--sm-amber);color:var(--sm-accent-text);font-weight:800;font-size:40px;padding:26px 56px;border-radius:99px;align-self:center}
.dots{display:flex;gap:10px}.dots i{width:54px;height:12px;border-radius:6px;background:var(--sm-rule)}.dots i.on{background:var(--sm-amber)}
.ans{border:3px solid var(--sm-amber);border-radius:24px;padding:26px;font-size:38px;line-height:1.25;background:#fff;min-height:190px}
.cur{display:inline-block;width:4px;height:40px;background:var(--sm-charcoal);vertical-align:-6px;margin-left:2px}
.mic{align-self:flex-start;font-size:28px;font-weight:800;border:3px solid var(--sm-rule);border-radius:99px;padding:12px 26px;color:var(--sm-muted)}
.dark-p{background:var(--sm-dark-bg);color:var(--sm-off-white)}
.pr{font-size:46px;font-weight:800;line-height:1.28}.pr .dim{color:#7d8794;font-weight:500}
.rec{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:800}.rec i{width:22px;height:22px;border-radius:50%;background:var(--sm-amber)}
.big{font-size:260px;font-weight:800;color:var(--sm-amber);text-align:center;line-height:1}
.wa{background:#E7E1D5;border-radius:40px}
.bub{background:#fff;border-radius:8px 28px 28px 28px;padding:24px 28px;font-size:32px;line-height:1.3;max-width:640px;box-shadow:0 2px 0 rgb(0 0 0 / .08)}
.thumb{height:260px;border-radius:18px;background:var(--sm-charcoal-2);position:relative;margin-bottom:14px;overflow:hidden}
.thumb .lt{position:absolute;left:18px;bottom:18px;background:var(--sm-amber);color:var(--sm-accent-text);font-weight:800;font-size:24px;padding:8px 14px;border-radius:10px}
.thumb .cp{position:absolute;left:0;right:0;bottom:78px;text-align:center;font-size:24px;color:#fff}
.centre{position:absolute;left:0;right:0;display:grid;justify-items:center;gap:36px}
</style>
<body>
<div class="hd" id="hd"></div>
<div class="stage" id="stage"></div>
<div class="cap" id="cap" hidden><span id="capt"></span></div>
<script>
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="#2A1B02" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SAMPLE='<div class="tag">SAMPLE</div>';
const face=(c)=>'<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="42" r="26" fill="'+c+'"/><path d="M12 116c4-34 26-46 48-46s44 12 48 46z" fill="'+c+'"/></svg>';
const scenes={
 title:(r)=>'',
 why:()=>'<div class="panel">'+SAMPLE+'<div class="k">WHY</div><div class="h2">People show up for people.</div><div style="display:flex;gap:30px;align-items:center;margin-top:10px">'+face('#1F2933')+'<div style="font-size:90px;color:#F5A623;font-weight:800">&rarr;</div><div class="tick" style="width:120px;height:120px">'+TICK+'</div></div><div class="bar" style="width:70%;margin-top:6px"></div><div class="bar" style="width:50%"></div></div>',
 interview:()=>'<div class="panel">'+SAMPLE+'<div class="k">QUESTION 3 OF 8</div><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="h2">Where are you from, and which languages do you speak?</div><div class="ans">I grew up in Pretoria. I speak English and Afrikaans<span class="cur"></span></div><div class="mic">or tap to speak</div></div>',
 scripts:()=>'<div class="panel">'+SAMPLE+'<div class="k">PICK ONE</div><div class="card"><div class="t">Script 1</div><div class="bar" style="width:92%"></div><div class="bar" style="width:70%"></div></div><div class="card sel"><div class="t">Script 2 &middot; edited by you</div><div class="bar" style="width:88%"></div><div class="bar" style="width:76%"></div><div style="display:flex;gap:14px;align-items:center;font-size:30px;font-weight:800"><div class="tick" style="width:44px;height:44px">'+TICK+'</div>Compliance check passed</div></div><div class="card"><div class="t">Script 3</div><div class="bar" style="width:84%"></div><div class="bar" style="width:60%"></div></div></div>',
 checklist:()=>'<div class="panel">'+SAMPLE+'<div class="k">BEFORE YOU RECORD</div><div class="row"><div class="tick">'+TICK+'</div><div><b>Face a window</b><small>Light on your face, not behind you</small></div></div><div class="row"><div class="tick">'+TICK+'</div><div><b>Phone at eye level</b><small>Looks like a conversation</small></div></div><div class="row"><div class="tick">'+TICK+'</div><div><b>Look at the lens</b><small>Reads as eye contact</small></div></div></div>',
 count:()=>'<div class="panel dark-p">'+SAMPLE+'<div class="k" style="color:#aab3be">TELEPROMPTER</div><div style="flex:1;display:grid;place-items:center"><div class="big">3</div></div><div style="text-align:center;font-size:32px;color:#aab3be">Starting in 3, 2, 1</div></div>',
 prompt:()=>'<div class="panel dark-p">'+SAMPLE+'<div class="rec"><i></i>0:12 / 0:25</div><div class="pr"><span class="dim">Hi, I\'m Sam from Example Financial Planning,</span><br>FSP 00000 (SAMPLE).<br>I help families work out where they stand.<br><span class="dim">On our call I\'ll ask a few questions</span></div></div>',
 verdict:()=>'<div class="panel">'+SAMPLE+'<div class="k">TAKE 1 &middot; 25 SECONDS</div><div class="h2">Looks good. One take is fine.</div><div class="row"><div class="tick">'+TICK+'</div><div><b>Face in frame</b></div></div><div class="row"><div class="tick">'+TICK+'</div><div><b>Light and voice clear</b></div></div></div>',
 approve:()=>'<div class="panel wa">'+SAMPLE+'<div class="k">WHATSAPP</div><div class="bub"><div class="thumb"><div class="cp">captions on</div><div class="lt">Sam Example &middot; FSP 00000 (SAMPLE)</div></div>Here is your intro, with captions and your details. Approve it?</div><div class="btn" style="margin-top:14px">Approve</div></div>'
};
window.__render=(o)=>{
 document.body.className=o.ratio==='1x1'?'r1x1':'';
 const hd=document.getElementById('hd');hd.innerHTML=o.head||'';hd.hidden=!o.head;
 const st=document.getElementById('stage');
 if(o.scene==='title'||o.scene==='end'){
  const is1=o.ratio==='1x1';
  const tk=is1?200:300, lw=is1?820:940, top=is1?(o.scene==='title'?330:330):(o.scene==='title'?640:560);
  st.style.top=top+'px';
  st.innerHTML='<div style="display:grid;justify-items:center;gap:'+(is1?40:60)+'px"><img src="../../../../../brand/logo/tick-mark.svg" width="'+tk+'" height="'+tk+'" alt="">'+
   (o.scene==='title'?'<img src="../../../../../brand/logo/wordmark-offwhite.svg" width="'+(is1?560:700)+'" alt=""><div style="font-size:'+(is1?34:42)+'px;font-weight:800;color:#F5A623;letter-spacing:.03em">Step 5 of 7 &middot; about 10 minutes</div>'
   :'<img src="../../../../../brand/logo/lockup-endorsement-offwhite.svg" width="'+lw+'" alt="SortMyCover, a service of Lead Velocity (Pty) Ltd">')+'</div>';
 } else { st.style.top=''; st.innerHTML=scenes[o.scene](); }
 const cap=document.getElementById('cap');cap.hidden=!o.cap;document.getElementById('capt').textContent=o.cap||'';
 return document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))));
};
</script>
