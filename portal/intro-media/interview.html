<!doctype html>
<html lang="en" data-api="/intro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Questions | Record your intro</title>
<link rel="stylesheet" href="step.css">
</head>
<body data-page="interview">
<main class="screen">
<header class="ph"><div class="k" id="qk">Question 1 of 8 · type or talk</div><h1 id="qh">Who do you help most?</h1><div class="steps" aria-label="Step 5 of 7"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div></header>
<div class="pb">
  <div class="q" id="qtext"></div>
  <div class="ex" id="qex"></div>
  <label class="lbl" for="answer">Your answer</label>
  <textarea class="field" id="answer" rows="5" autocomplete="off" placeholder="Type here, or tap the microphone"></textarea>
  <div class="mic"><button type="button" id="mic" aria-label="Answer by voice">●</button><span id="micnote">Tap to answer by voice, tap again to stop. We'll transcribe it and you can fix it.</span></div>
  <button class="btn" id="next" type="button">Next</button>
  <button class="link" id="back" type="button" hidden>Back</button>
  <div class="lbl" id="progress"></div>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
