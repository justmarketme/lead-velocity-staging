<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>05 The plumbing</title>
<link rel="stylesheet" href="film.css">
<style>
  .lap { position: absolute; left: 140px; top: 400px; width: 360px; height: 400px; padding: 40px 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .lap svg.big { width: 150px; height: 150px; stroke: var(--navy); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .lap .tx { margin-top: 16px; font-size: 32px; font-weight: 700; color: var(--navy); }
  .lap .sb { margin-top: 6px; font-size: 21px; color: var(--muted); }
  .wire { position: absolute; left: 500px; top: 597px; width: 110px; height: 6px; border-radius: 3px; background: var(--grad); transform-origin: left; }
  .dock { position: absolute; left: 610px; top: 340px; width: 560px; height: 520px; border-radius: 26px; border: 2.5px dashed var(--purple-soft); background: rgba(245,243,255,.6); padding: 30px; }
  .dock > .lbl { color: var(--purple); }
  .svc { margin-top: 22px; height: 118px; display: flex; align-items: center; gap: 22px; padding: 0 28px; }
  .svc .tx { font-size: 32px; font-weight: 700; color: var(--navy); }
  .svc .sb { font-size: 20px; color: var(--muted); margin-top: 2px; }
  .svc .st { margin-left: auto; }
  .keep { position: absolute; left: 30px; right: 30px; bottom: 28px; height: 100px; display: flex; align-items: center; gap: 20px; padding: 0 26px; border-radius: 18px; background: #fff; border: 1.5px solid var(--purple-soft); }
  .keep svg { width: 54px; height: 54px; stroke: var(--purple); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .keep .tx { font-size: 26px; font-weight: 700; color: var(--navy); }
  .keep .sb { font-size: 19px; color: var(--muted); }
  .vc { position: absolute; left: 1240px; top: 400px; width: 540px; height: 400px; padding: 40px; }
  .vc .tri { width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 58px solid var(--navy); }
  .vc .dm { margin-top: 26px; font-size: 38px; font-weight: 700; color: var(--navy); letter-spacing: -.01em; }
  .vc .sb { margin-top: 6px; font-size: 21px; color: var(--muted); }
  .vc .rows { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
</style></head>
<body data-scene="s05"><div class="stage">
  <div class="top"><div class="eyebrow">Done</div><h1 class="h"><i></i>The plumbing</h1></div>
  <div class="card lap"><svg class="big" viewBox="0 0 48 48"><rect x="9" y="10" width="30" height="20" rx="2"/><path d="M4 36h40l-3 4H7z"/></svg><div class="tx">Laptop</div><div class="sb">Runs it all in Docker</div></div>
  <div class="wire"></div>
  <div class="dock"><div class="lbl">Docker</div>
    <div class="card svc"><div class="ic-g"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 12h4l5-6M11.5 12l5 6"/></svg></div><div><div class="tx">n8n</div><div class="sb">Automations</div></div><span class="pill green st"><i></i><span>Up</span></span></div>
    <div class="card svc"><div class="ic-g"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></div><div><div class="tx">Postgres</div><div class="sb">Its database</div></div><span class="pill green st"><i></i><span>Up</span></span></div>
    <div class="keep"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><div><div class="tx">Self-healing keeper</div><div class="sb">Restarts everything if it falls over</div></div></div>
  </div>
  <div class="card vc"><div class="tri"></div><div class="dm">sortmycover.co.za</div><div class="sb">Set up on Vercel</div>
    <div class="rows"><span class="pill pink sec"><i></i>Own security rules</span><span class="pill amber nl"><i></i>Not live yet</span></div></div>
</div>
<script src="timings.js"></script><script src="film.js"></script>
<script>
  const keepIc = $('.keep svg'), svc = $$('.svc'), pills = $$('.svc .st');
  window.update = t => {
    rv('.top .eyebrow', t, .2, { y: 16 });
    rv('.top h1', t, .3, { y: 30, blur: 6, dur: 1 });
    rv('.lap', t, cue('laptop') - .4, { y: 36, scale: .95, dur: .9 });
    $('.wire').style.transform = `scaleX(${P(t, cue('n8n') - .5, .5, E.inOut).toFixed(4)})`;
    rv('.dock', t, cue('n8n') - .3, { y: 0, scale: .97, dur: .8 });
    rv(svc[0], t, cue('n8n') - .1, { x: 24, y: 0, dur: .7 });
    rv(svc[1], t, cue('database') - .2, { x: 24, y: 0, dur: .7 });
    rv('.keep', t, cue('keeper') - .3, { y: 24, dur: .8 });
    // restart loop: one full turn on "restarts", then idles slowly
    const spin = 360 * P(t, cue('restarts'), 1.2, E.inOut) + Math.max(0, t - cue('keeper')) * 30;
    keepIc.style.transform = `rotate(${spin.toFixed(2)}deg)`;
    // services blip to "Restarting" and back while the keeper is described
    const blip = t > cue('falls') && t < cue('falls') + 1.1;
    pills.forEach(p => { p.className = (blip ? 'pill amber' : 'pill green') + ' st'; p.lastChild.textContent = blip ? 'Restarting' : 'Up'; });
    rv('.vc', t, cue('sortmycover') - .4, { y: 36, scale: .95, dur: .9 });
    rv('.sec', t, cue('security') - .2, { x: 16, y: 0, dur: .6 });
    rv('.nl', t, cue('nothing') - .1, { x: 16, y: 0, scale: .9, dur: .7, ease: E.back });
  };
</script></body></html>
