<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>02 Getting you live</title>
<link rel="stylesheet" href="film.css">
<style>
  .left { position: absolute; left: 140px; top: 200px; width: 620px; }
  .left h1 { margin-top: 18px; }
  .ring { position: relative; margin-top: 64px; width: 300px; height: 300px; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .big { font-size: 92px; font-weight: 700; color: var(--navy); letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring .big small { font-size: 44px; color: var(--faint); font-weight: 600; }
  .ring .cap { margin-top: 8px; }
  .list { position: absolute; left: 820px; top: 188px; width: 960px; padding: 30px 34px 22px; }
  .list .lbl { margin: 0 0 14px 6px; }
  .row { position: relative; display: flex; align-items: center; gap: 26px; height: 116px; padding: 0 22px; border-radius: 18px; }
  .row + .row { margin-top: 6px; }
  .row .wash { position: absolute; inset: 0; border-radius: 18px; background: var(--pink-wash); border: 1.5px solid var(--pink-soft); opacity: 0; }
  .box { position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid #cbd5e1; background: #fff; }
  .box .fill { position: absolute; inset: -2.5px; border-radius: 50%; background: var(--grad); transform: scale(0); box-shadow: 0 8px 18px -6px rgba(219,39,119,.55); }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .box path { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; }
  .tx { position: relative; }
  .tx .a { font-size: 34px; font-weight: 700; color: var(--navy); line-height: 1.15; }
  .tx .b { font-size: 21px; color: var(--muted); margin-top: 4px; }
  .row .n { position: relative; margin-left: auto; font-size: 18px; font-weight: 700; color: var(--faint); letter-spacing: .1em; }
  .row.last .a { background: var(--grad); -webkit-background-clip: text; color: transparent; }
</style></head>
<body data-scene="s02"><div class="stage">
  <div class="left">
    <div class="eyebrow">Step one</div>
    <h1 class="h"><i></i>Getting you live</h1>
    <div class="ring">
      <svg viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#9333ea"/></linearGradient></defs>
        <circle cx="150" cy="150" r="132" fill="none" stroke="#e2e8f0" stroke-width="14"/>
        <circle id="arc" cx="150" cy="150" r="132" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="829.4" stroke-dashoffset="829.4"/></svg>
      <div class="mid"><div class="big"><span id="cnt">0</span><small> / 5</small></div><div class="lbl cap">Onboarding</div></div>
    </div>
  </div>
  <div class="card list">
    <div class="lbl">Your onboarding checklist</div>
    <div class="row"><div class="wash"></div><div class="box"><div class="fill"></div><svg viewBox="0 0 56 56"><path d="M17 29l7 7 15-16"/></svg></div><div class="tx"><div class="a">FSP check</div><div class="b">Your FSP number, on the public FSCA register</div></div><div class="n">01</div></div>
    <div class="row"><div class="wash"></div><div class="box"><div class="fill"></div><svg viewBox="0 0 56 56"><path d="M17 29l7 7 15-16"/></svg></div><div class="tx"><div class="a">Calendar connected</div></div><div class="n">02</div></div>
    <div class="row"><div class="wash"></div><div class="box"><div class="fill"></div><svg viewBox="0 0 56 56"><path d="M17 29l7 7 15-16"/></svg></div><div class="tx"><div class="a">Photo and bio</div></div><div class="n">03</div></div>
    <div class="row"><div class="wash"></div><div class="box"><div class="fill"></div><svg viewBox="0 0 56 56"><path d="M17 29l7 7 15-16"/></svg></div><div class="tx"><div class="a">WhatsApp number</div><div class="b">Your business number</div></div><div class="n">04</div></div>
    <div class="row last"><div class="wash"></div><div class="box"><div class="fill"></div><svg viewBox="0 0 56 56"><path d="M17 29l7 7 15-16"/></svg></div><div class="tx"><div class="a">Campaigns live</div><div class="b">Within 3 business days of payment and onboarding</div></div><div class="n">05</div></div>
  </div>
</div>
<script src="timings.js"></script><script src="film.js"></script>
<script>
  const rows = $$('.row');
  const tick = [cue('register') - .2, cue('calendar'), cue('photo'), cue('whatsapp'), cue('live')];
  window.update = t => {
    rv('.left .eyebrow', t, .2, { y: 16 });
    rv('.left h1', t, .35, { y: 30, blur: 6, dur: 1 });
    rv('.ring', t, .7, { y: 24, scale: .94, dur: 1.1 });
    rv('.list', t, .45, { y: 40, dur: 1.1 });
    rv(rows, t, .8, { y: 18, stagger: .09, dur: .8 });
    let done = 0;
    rows.forEach((r, i) => {
      const p = P(t, tick[i], .55, E.back), pc = P(t, tick[i] + .15, .45);
      r.querySelector('.fill').style.transform = `scale(${clamp(p, 0, 1.2).toFixed(4)})`;
      r.querySelector('path').style.strokeDashoffset = (30 * (1 - pc)).toFixed(2);
      // brief highlight while the item is being spoken, the last one stays lit
      const on = P(t, tick[i] - .1, .4), off = i === 4 ? 0 : P(t, tick[i] + 1.6, .8);
      r.querySelector('.wash').style.opacity = (on * (1 - off)).toFixed(3);
      done += P(t, tick[i], .6, E.inOut);
    });
    $('#arc').style.strokeDashoffset = (829.4 * (1 - done / 5)).toFixed(2);
    $('#cnt').textContent = tick.filter(x => t >= x + .25).length;
  };
</script></body></html>
