<!doctype html><html lang="en-ZA"><meta charset="utf8"><title>SortMyCover concept scene engine</title>
<!-- Deterministic scene renderer: SC.init(spec) then await SC.draw(t). Every pixel is a pure function of (spec, t) so stills and video frames come from one source.
     Colours only via brand/tokens.css variables (no hex here). Imagery is drawn in code: no photographs, no people, no AI imagery. -->
<link rel="stylesheet" href="../../../brand/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sm-charcoal)}
#stage{position:relative;overflow:hidden;font-family:var(--sm-font);font-weight:500;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  --bg:var(--sm-charcoal);--fg:var(--sm-off-white);--acc:var(--sm-amber);--acc-ink:var(--sm-accent-text);--box:var(--sm-charcoal-2);
  --tdisc:var(--sm-amber);--tink:var(--sm-accent-text);--soft:color-mix(in srgb,var(--fg) 14%,transparent);--mid:color-mix(in srgb,var(--fg) 45%,transparent);background:var(--bg);color:var(--fg)}
#stage.teal{--tdisc:var(--sm-test-teal-accent);--tink:var(--sm-test-teal-ink);--bg:var(--sm-off-white);--fg:var(--sm-charcoal);--acc:var(--sm-test-teal-accent);--acc-ink:var(--sm-test-teal-ink);--box:var(--sm-off-white-2)}
#dyn{position:absolute;inset:0}
#stage img.p{position:absolute;display:block}
</style>
<body><div id="stage"><div id="dyn"></div><img class="p" id="tw" src="../../../brand/logo/tick-mark.svg" alt=""><img class="p" id="wmo" alt=""></div>
<script src="engine.js"></script>
