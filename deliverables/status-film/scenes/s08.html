<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>08 Close</title>
<link rel="stylesheet" href="film.css">
<style>
  .hero { position: absolute; left: 0; right: 0; top: 200px; display: flex; flex-direction: column; align-items: center; }
  .logo { height: 230px; width: auto; filter: drop-shadow(0 24px 40px rgba(147,51,234,.18)); }
  .title { margin-top: 36px; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -.03em; color: var(--navy); }
  .rule { margin-top: 30px; width: 180px; height: 7px; border-radius: 4px; background: var(--grad); }
  .cta { margin-top: 50px; display: flex; align-items: center; gap: 20px; padding: 20px 40px 20px 20px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); box-shadow: var(--shadow-lg); font-size: 32px; font-weight: 700; color: var(--navy); }
  .cta .tick { width: 54px; height: 54px; }
</style></head>
<body data-scene="s08" data-header="0"><div class="stage">
  <div class="hero">
    <img class="logo" src="assets/lead-velocity-logo-contract.png" alt="Lead Velocity">
    <div class="title">That's the picture.</div>
    <div class="rule"></div>
    <div class="cta"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Open the interactive status page to tick items off.</div>
  </div>
</div>
<script src="timings.js"></script><script src="film.js"></script>
<script>
  window.update = t => {
    rv('.logo', t, .15, { y: 26, scale: .92, blur: 10, dur: 1.2 });
    $('.logo').style.transform += ` translateY(${(Math.sin(t * 1.1) * 4).toFixed(2)}px)`;
    rv('.title', t, cue('picture') - .5, { y: 36, blur: 8, dur: 1 });
    $('.rule').style.transform = `scaleX(${P(t, cue('picture'), 1, E.inOut).toFixed(4)})`;
    rv('.cta', t, cue('interactive') - .3, { y: 30, scale: .95, dur: .9 });
    tick($('.cta .tick'), t, cue('tick'));
  };
</script></body></html>
