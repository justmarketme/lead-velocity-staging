<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>01 The goal</title>
<link rel="stylesheet" href="film.css">
<style>
  .hero { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; }
  .logo { height: 150px; width: auto; filter: drop-shadow(0 20px 34px rgba(147,51,234,.18)); }
  .eb { margin-top: 22px; }
  .title { margin-top: 10px; font-size: 112px; line-height: 1; font-weight: 700; letter-spacing: -.035em; color: var(--navy); display: flex; gap: 28px; }
  .title span { display: inline-block; }
  .rule { margin-top: 26px; width: 180px; height: 7px; border-radius: 4px; background: var(--grad); }
  .flow { margin-top: 50px; display: flex; align-items: center; }
  .node { width: 300px; height: 132px; display: flex; align-items: center; gap: 18px; padding: 0 24px; }
  .node .n { font-size: 15px; font-weight: 700; color: var(--faint); letter-spacing: .12em; }
  .node .tx { font-size: 27px; font-weight: 700; color: var(--navy); line-height: 1.12; margin-top: 4px; }
  .arr { width: 74px; height: 6px; position: relative; margin: 0 6px; }
  .arr i { position: absolute; inset: 0; border-radius: 3px; background: var(--grad); transform-origin: left; }
  .arr b { position: absolute; right: -4px; top: -8px; width: 0; height: 0; border-left: 14px solid #9333ea; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
  .chips { margin-top: 44px; display: flex; gap: 22px; }
  .chip { display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 32px 0 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 27px; font-weight: 700; color: var(--navy); }
  .chip .tick { width: 44px; height: 44px; }
</style></head>
<body data-scene="s01" data-header="0"><div class="stage">
  <div class="hero">
    <img class="logo" src="assets/lead-velocity-logo-contract.png" alt="Lead Velocity">
    <div class="eyebrow eb">Status update · 7 October 2026</div>
    <div class="title"><span>Where</span><span>we</span><span>are</span></div>
    <div class="rule"></div>
    <div class="flow">
      <div class="card node"><div class="ic-g"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg></div><div><div class="n">01</div><div class="tx">SortMyCover ads</div></div></div>
      <div class="arr"><i></i><b></b></div>
      <div class="card node"><div class="ic-g"><svg viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 10h6M9 13.5h4"/></svg></div><div><div class="n">02</div><div class="tx">WhatsApp booking</div></div></div>
      <div class="arr"><i></i><b></b></div>
      <div class="card node"><div class="ic-g"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 14.5l2 2 4-4"/></svg></div><div><div class="n">03</div><div class="tx">Broker's diary</div></div></div>
      <div class="arr"><i></i><b></b></div>
      <div class="card node"><div class="ic-g"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 13l3-3 2 2 5-5"/></svg></div><div><div class="n">04</div><div class="tx">Portal</div></div></div>
    </div>
    <div class="chips">
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div> Flat fee</div>
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div> No advice</div>
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div> No commission</div>
    </div>
  </div>
</div>
<script src="timings.js"></script><script src="film.js"></script>
<script>
  const nodes = $$('.node'), arrs = $$('.arr'), chips = $$('.chip');
  const tN = [cue('SortMyCover'), cue('WhatsApp'), cue('booking'), cue('portal')];
  const tC = [cue('flat'), cue('advice'), cue('tying')];
  window.update = t => {
    rv('.logo', t, .2, { y: 26, scale: .9, blur: 10, dur: 1.2 });
    $('.logo').style.transform += ` translateY(${(Math.sin(t * 1.1) * 4).toFixed(2)}px)`;
    rv('.eb', t, .6, { y: 16 });
    rv('.title span', t, .7, { y: 46, blur: 8, stagger: .12, dur: 1.1 });
    $('.rule').style.transform = `scaleX(${P(t, 1.3, 1.1, E.inOut).toFixed(4)})`;
    // the flow is introduced as the goal is described, then lights up node by node
    nodes.forEach((n, i) => {
      rv(n, t, tN[i] - .7, { y: 30, scale: .95, dur: .9 });
      const hot = P(t, tN[i] - .1, .5) * (1 - (i < 3 ? P(t, tN[i + 1] + .4, .8) * .6 : 0));
      n.style.borderColor = `rgba(219,39,119,${(hot * .55).toFixed(3)})`;
      n.style.boxShadow = `0 1px 2px rgba(15,23,42,.05), 0 ${(18 + 12 * hot).toFixed(1)}px 44px -18px rgba(219,39,119,${(.18 + .35 * hot).toFixed(3)})`;
    });
    arrs.forEach((a, i) => {
      const p = P(t, tN[i + 1] - .6, .6, E.inOut);
      a.querySelector('i').style.transform = `scaleX(${p.toFixed(4)})`;
      a.querySelector('b').style.opacity = p >= 1 ? 1 : 0;
      a.style.opacity = P(t, tN[i + 1] - .6, .2);
    });
    chips.forEach((c, i) => { rv(c, t, tC[i] - .3, { y: 30, scale: .94, dur: .8 }); tick(c.querySelector('.tick'), t, tC[i]); });
  };
</script></body></html>
