<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>01 Where we are</title>
<link rel="stylesheet" href="film.css">
<style>
  .hero { position: absolute; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; }
  .logo { height: 136px; width: auto; filter: drop-shadow(0 20px 34px rgba(147,51,234,.18)); }
  .eb { margin-top: 20px; }
  .title { margin-top: 10px; font-size: 112px; line-height: 1; font-weight: 700; letter-spacing: -.035em; color: var(--navy); display: flex; gap: 28px; }
  .title span { display: inline-block; }
  .rule { margin-top: 26px; width: 180px; height: 7px; border-radius: 4px; background: var(--grad); }
  .chips { margin-top: 42px; display: flex; gap: 22px; }
  .chip { display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 32px 0 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 27px; font-weight: 700; color: var(--navy); }
  .chip .tick { width: 44px; height: 44px; }
  .chip small { font-size: 19px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .stats { margin-top: 36px; display: flex; gap: 24px; }
  .st { width: 430px; height: 150px; padding: 24px 30px; }
  .st .v { font-size: 50px; font-weight: 700; color: var(--navy); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .st .v small { font-size: 26px; color: var(--faint); font-weight: 600; letter-spacing: 0; }
  .st .k { margin-top: 10px; font-size: 21px; color: var(--muted); font-weight: 600; }
  .meter { margin-top: 14px; height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 5px; }
  .st.next { background: var(--navy); border-color: var(--navy); display: flex; align-items: center; gap: 20px; }
  .st.next .tx { color: #fff; font-size: 30px; font-weight: 700; line-height: 1.15; }
  .st.next .tx span { display: block; font-size: 19px; color: #cbd5e1; font-weight: 600; margin-top: 6px; }
</style></head>
<body data-scene="s01" data-header="0"><div class="stage">
  <div class="hero">
    <img class="logo" src="assets/lead-velocity-logo-contract.png" alt="Lead Velocity">
    <div class="eyebrow eb">Status update · 13 October 2026</div>
    <div class="title"><span>Where</span><span>we</span><span>are</span></div>
    <div class="rule"></div>
    <div class="chips">
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Mark signed</div>
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Paid <small>R16,500</small></div>
      <div class="chip"><div class="tick"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Logged in <small>today</small></div>
    </div>
    <div class="stats">
      <div class="card st"><div class="v"><span id="wf">0</span> <small>of 43</small></div><div class="k">n8n workflows switched on</div><div class="meter"><i id="wfm"></i></div></div>
      <div class="card st"><div class="v">0</div><div class="k">SortMyCover leads so far</div></div>
      <div class="card st next"><div class="ic-g"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></div><div class="tx">Next: switch it on<span>Safely, one tested step at a time</span></div></div>
    </div>
  </div>
</div>
<script src="timings.js"></script><script src="film.js"></script>
<script>
  const chips = $$('.chip'), sts = $$('.st');
  const tC = [cue('signed'), cue('paid'), cue('logged')];
  const tS = [cue('switched'), cue('lead'), cue('switching')];
  window.update = t => {
    rv('.logo', t, .2, { y: 26, scale: .9, blur: 10, dur: 1.2 });
    $('.logo').style.transform += ` translateY(${(Math.sin(t * 1.1) * 4).toFixed(2)}px)`;
    rv('.eb', t, .5, { y: 16 });
    rv('.title span', t, .6, { y: 46, blur: 8, stagger: .12, dur: 1.1 });
    $('.rule').style.transform = `scaleX(${P(t, 1.2, 1.1, E.inOut).toFixed(4)})`;
    chips.forEach((c, i) => { rv(c, t, tC[i] - .35, { y: 30, scale: .94, dur: .8 }); tick(c.querySelector('.tick'), t, tC[i] + .1); });
    sts.forEach((s, i) => rv(s, t, tS[i] - .4, { y: 30, scale: .95, dur: .9 }));
    const w = P(t, tS[0], 1.2, E.out5);
    $('#wf').textContent = Math.round(3 * w);
    $('#wfm').style.width = (3 / 43 * 100 * w).toFixed(2) + '%';
  };
</script></body></html>
