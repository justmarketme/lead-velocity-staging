# VPS overlay: Traefik TLS in front of n8n (Hostinger KVM + Traefik docs; n8n self-hosting docs "Docker Compose + Traefik").
# Used only on the VPS, on top of automation/docker-compose.yml (unchanged):
#   docker compose --env-file /opt/lead-velocity/.env -p lv \
#     -f automation/docker-compose.yml -f automation/vps/traefik/docker-compose.traefik.yml up -d
# Hosts (from .env): N8N_UI_HOST (editor, IP allow-list), API_HOST (webhooks + /healthz only), LINK_HOST (consumer /c/ /j/).
# No secrets here; ACME e-mail comes from TRAEFIK_ACME_EMAIL. One server, no orchestrator.
# No MinIO and no transcription (speech-to-text) container is expected here (I-47i): W23 intro media uses Supabase Storage's S3 endpoint
# (SUPABASE_S3_*) and an external TRANSCRIBE_URL, both chosen by env in .env.example.

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:?set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=false
      - --log.level=WARN
      # access log off: webhook query strings (hub.verify_token) and client IPs stay out of logs
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

  n8n:
    environment:
      NODE_ENV: production
      N8N_HOST: ${N8N_UI_HOST:?set N8N_UI_HOST}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_UI_HOST}/
      WEBHOOK_URL: https://${API_HOST:?set API_HOST}/
      N8N_PUBLIC_URL: https://${API_HOST}
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_LOG_LEVEL: warn
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000
      # Same values as automation/docker-compose.yml (I-35b / I-36e / I-46d); repeated so an overlay edit cannot narrow them.
      REPO_DIR: /repo
      AUTOMATION_DIR: /repo/automation
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,dns,url,fs,path
      NODE_FUNCTION_ALLOW_EXTERNAL: lv-automation
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # I-06: W23 has two Execute Command nodes (ffmpeg / ffprobe on intro media). n8n 2.x excludes that node by default, so
      # re-enable it and keep only the file-watch trigger excluded. Same value as automation/docker-compose.yml. See SECURITY.md.
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
    # lv-automation link step (I-46d), identical to automation/docker-compose.yml; repeated so the overlay cannot drop it.
    # /repo here is /opt/lead-velocity (provision.sh step 4), mounted read-only by the base file.
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /home/node/.node_modules && ln -sfn /repo/automation /home/node/.node_modules/lv-automation && exec /docker-entrypoint.sh "$$@"
      - lv-link
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      # Editor: IP allow-list. Empty N8N_UI_ALLOW_IPS = loopback only, i.e. reach it with `ssh -L 5678:localhost:5678`.
      - traefik.http.routers.n8n-ui.rule=Host(`${N8N_UI_HOST}`)
      - traefik.http.routers.n8n-ui.entrypoints=websecure
      - traefik.http.routers.n8n-ui.tls.certresolver=le
      - traefik.http.routers.n8n-ui.middlewares=ui-allow,sec-headers
      - traefik.http.middlewares.ui-allow.ipallowlist.sourcerange=${N8N_UI_ALLOW_IPS:-127.0.0.1/32}
      # Public API host: production webhooks and health only (no /webhook-test, no editor, no REST API).
      - traefik.http.routers.n8n-api.rule=Host(`${API_HOST}`) && (PathPrefix(`/webhook/`) || PathPrefix(`/healthz`))
      - traefik.http.routers.n8n-api.entrypoints=websecure
      - traefik.http.routers.n8n-api.tls.certresolver=le
      - traefik.http.routers.n8n-api.middlewares=api-ratelimit,sec-headers
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100
      # Browser-called endpoints on API_HOST (I-34c): CORS for /lead, /slots, /book, /billing-autorenew only.
      # Same host as n8n-api, longer rule + explicit priority so these paths take this router. Traefik answers the
      # OPTIONS preflight itself and sets Access-Control-Allow-Origin (overwriting any n8n webhook allowedOrigins value).
      # Origins: PUBLIC_ALLOWED_ORIGINS (comma list, .env) or the production default below (I-37i: no staging subdomain on
      # production; www.sortmycover.co.za and www.leadvelocity.co.za included). Staging values: see .env.example. Never "*", no credentials (cookies) allowed.
      - traefik.http.routers.n8n-cors.rule=Host(`${API_HOST}`) && (Path(`/webhook/lead`) || Path(`/webhook/slots`) || Path(`/webhook/book`) || Path(`/webhook/billing-autorenew`))
      - traefik.http.routers.n8n-cors.priority=1000
      - traefik.http.routers.n8n-cors.entrypoints=websecure
      - traefik.http.routers.n8n-cors.tls.certresolver=le
      - traefik.http.routers.n8n-cors.middlewares=api-cors,api-ratelimit,sec-headers
      - traefik.http.middlewares.api-cors.headers.accessControlAllowOriginList=${PUBLIC_ALLOWED_ORIGINS:-https://sortmycover.co.za,https://www.sortmycover.co.za,https://leadvelocity.co.za,https://www.leadvelocity.co.za}
      - traefik.http.middlewares.api-cors.headers.accessControlAllowMethods=GET,POST,OPTIONS
      - traefik.http.middlewares.api-cors.headers.accessControlAllowHeaders=Content-Type,X-Lead-Token,Authorization
      - traefik.http.middlewares.api-cors.headers.accessControlAllowCredentials=false
      - traefik.http.middlewares.api-cors.headers.accessControlMaxAge=600
      - traefik.http.middlewares.api-cors.headers.addVaryHeader=true
      # Consumer links on the SortMyCover domain (LINK_HOST), one router per path so each gets its own rewrite.
      # n8n puts the webhookId in front of any path with a :param, so /c/{id} and /wa/{ref} cannot map to /webhook/c|wa/... (404):
      #   /c/{booking_id}  -> /webhook/w05-ics-get/c/{booking_id}      (W05 GET c/:booking_id, I-55e / I-45j; query ?k= is kept)
      #   /wa/{ref}        -> /webhook/w03-ctwa-redirect/wa/{ref}      (W03 GET wa/:ref, I-44e / I-09)
      #   /j/{ref}         -> /webhook/j/{ref}                         (join redirect; no webhook built yet, so it 404s until it exists)
      # Same webhookIds as W05.json / W03.json (asserted in W26.test.mjs). Public, GET only; rate-limited and header-hardened like n8n-api.
      - traefik.http.routers.n8n-link.rule=Host(`${LINK_HOST:-link.invalid}`) && PathPrefix(`/j/`)
      - traefik.http.routers.n8n-link.entrypoints=websecure
      - traefik.http.routers.n8n-link.tls.certresolver=le
      - traefik.http.routers.n8n-link.middlewares=link-rewrite,api-ratelimit,sec-headers
      - traefik.http.middlewares.link-rewrite.replacepathregex.regex=^/j/(.*)
      - traefik.http.middlewares.link-rewrite.replacepathregex.replacement=/webhook/j/$$1
      - traefik.http.routers.n8n-link-c.rule=Host(`${LINK_HOST:-link.invalid}`) && PathPrefix(`/c/`)
      - traefik.http.routers.n8n-link-c.entrypoints=websecure
      - traefik.http.routers.n8n-link-c.tls.certresolver=le
      - traefik.http.routers.n8n-link-c.middlewares=link-rewrite-c,api-ratelimit,sec-headers
      - traefik.http.middlewares.link-rewrite-c.replacepathregex.regex=^/c/(.*)
      - traefik.http.middlewares.link-rewrite-c.replacepathregex.replacement=/webhook/w05-ics-get/c/$$1
      - traefik.http.routers.n8n-link-wa.rule=Host(`${LINK_HOST:-link.invalid}`) && PathPrefix(`/wa/`)
      - traefik.http.routers.n8n-link-wa.entrypoints=websecure
      - traefik.http.routers.n8n-link-wa.tls.certresolver=le
      - traefik.http.routers.n8n-link-wa.middlewares=link-rewrite-wa,api-ratelimit,sec-headers
      - traefik.http.middlewares.link-rewrite-wa.replacepathregex.regex=^/wa/(.*)
      - traefik.http.middlewares.link-rewrite-wa.replacepathregex.replacement=/webhook/w03-ctwa-redirect/wa/$$1
      # Security headers (ASVS V14)
      - traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.sec-headers.headers.referrerPolicy=no-referrer
    depends_on:
      - traefik

volumes:
  traefik_letsencrypt:
