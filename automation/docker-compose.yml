# Local n8n staging (MASTER-PROMPT 0.3 #7) - n8n + Postgres until the VPS exists (W26).
# Values come from the repo-root .env (git-ignored); names are listed in automation/.env.example.
#   docker compose -f automation/docker-compose.yml up -d
# Webhooks reach this box through a tunnel; N8N_PUBLIC_URL / WEBHOOK_URL hold its public URL.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Scoped to the three Postgres values only (integration pass 2, I-15): the full .env
    # holds every secret and must not reach this container.
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
    volumes:
      - n8n_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_ENABLED: "true"
      # Code nodes load repo code through ONE module, lv-automation (automation/index.cjs, I-44a / I-46d):
      #   const L = require('lv-automation').w07;
      # n8n 2.41's task runner allowlists external modules by exact name and has no dynamic import(), so the
      # allowlist holds exactly that one name; the entrypoint below links it from the read-only repo mount.
      # Set here, not in .env, so local and VPS cannot drift; the VPS overlay repeats the same values.
      # No npm packages from the registry in Code nodes: lv-automation is this repo, nothing else is allowed.
      REPO_DIR: /repo
      AUTOMATION_DIR: /repo/automation
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,dns,url,fs,path
      NODE_FUNCTION_ALLOW_EXTERNAL: lv-automation
    # Link step for lv-automation (I-46d). $HOME/.node_modules is one of Node's global module folders and HOME
    # reaches the task runner; the container user (node) cannot write /usr/local/lib/node_modules, so the link
    # lives in /home/node (container layer, not a volume: recreated on every start, hence ln -sfn each time).
    # The link points INTO the full repo mount (/repo/automation), never a copy, so index.cjs's relative requires
    # resolve to /repo/conversation/*.mjs (w15), /repo/landing/config/consent.json (w01), /repo/data/*.json (w04).
    # init: true gives PID 1 signal handling (Docker's tini), so the image's own entrypoint can be exec'd by sh.
    # ASSUMPTION (checked at first `up`): the n8n image starts via /docker-entrypoint.sh, as in n8n's Dockerfile.
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /home/node/.node_modules && ln -sfn /repo/automation /home/node/.node_modules/lv-automation && exec /docker-entrypoint.sh "$$@"
      - lv-link
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # The repo root (this file's parent dir), read-only. Laptop: the working copy. VPS: /opt/lead-velocity
      # (provision.sh step 4 ships the runtime dirs from git HEAD, see W26.md). The mount adds no secret exposure:
      # the same .env is already this container's env (env_file), and Code nodes can read env anyway
      # (N8N_BLOCK_ENV_ACCESS_IN_NODE=false, SECURITY.md). Read-only, so a Code node cannot change the code it runs.
      - ..:/repo:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  n8n_postgres:
  n8n_data:
