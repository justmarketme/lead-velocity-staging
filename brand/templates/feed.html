<!doctype html><html lang="en-ZA"><meta charset="utf8"><title>Feed ad 1:1 / 4:5</title>
<link rel="stylesheet" href="_base.css">
<!-- Typographic-hook feed ad (4D.4a H1/H2). Sizes: 1080x1080 (default) or 1080x1350 (layout "r4x5").
     Imagery rule: this template draws its own props in code. If a Flow scene with people is dropped in later, set ai_label=true (bottom-right label, 4D.4b.3). -->
<style>
body{width:1080px;height:1080px}
.hook{left:72px;right:72px;top:72px;font-size:78px}
.sub{left:72px;right:72px;top:372px;font-size:var(--sm-canvas-md);font-weight:500;line-height:1.25;color:var(--sm-off-white);max-width:820px}
.table{left:0;right:0;bottom:0;height:372px;background:var(--sm-charcoal-2)}
.paper{position:absolute;background:var(--sm-off-white);color:var(--sm-charcoal);border-radius:12px;padding:30px 36px;box-shadow:0 18px 48px var(--sm-scrim);font-size:36px;line-height:1.3}
.paper small{display:block;font-size:30px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sm-muted);margin-bottom:10px}
.paper .amt{font-weight:800;font-size:44px;letter-spacing:-.01em;display:block;white-space:nowrap;margin-top:4px}
.p1{left:64px;bottom:210px;width:470px;transform:rotate(-4deg)}
.p2{right:64px;bottom:170px;width:470px;transform:rotate(3.5deg)}
.line{left:72px;bottom:112px;font-size:36px;font-weight:800;color:var(--sm-off-white);letter-spacing:-.005em}
.logo{left:72px;bottom:44px}.logo img{height:46px;display:block}
.ai{right:72px;bottom:50px;font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--sm-off-white)}
/* 4:5 */
body.r4x5{height:1350px}
.r4x5 .hook{font-size:88px;top:84px}.r4x5 .sub{top:470px}
.r4x5 .table{height:560px}
.r4x5 .p1{bottom:360px}.r4x5 .p2{bottom:290px}
.r4x5 .line{bottom:116px;left:72px}.r4x5 .logo{bottom:44px}
.r4x5 .paper{padding:36px 40px}
</style>
<body class="dark">
<div class="abs hook hd" data-bh="hook"></div>
<div class="abs sub" data-b="sub"></div>
<div class="abs table"></div>
<div class="paper p1" data-if="prop1"><small data-b="prop1_label"></small><span data-b="prop1_what"></span><span class="amt" data-b="prop1"></span></div>
<div class="paper p2" data-if="prop2"><small data-b="prop2_label"></small><span data-b="prop2_what"></span><span class="amt" data-b="prop2"></span></div>
<div class="abs line" data-b="line"></div>
<div class="abs logo"><img src="../logo/wordmark-offwhite.svg" alt="SortMyCover"></div>
<div class="abs ai" data-if="ai_label">AI-generated imagery</div>
<script>window.SM_DEFAULTS={hook:"Most work life cover stops at **2–4× salary.**\nMost bonds don’t.",sub:"A licensed adviser can check it in 30 minutes.",prop1_label:"Payslip · Group life",prop1_what:"Life cover",prop2_label:"Home loan statement",prop2_what:"Balance outstanding",line:"Sort your cover. 30 minutes. A real adviser.",ai_label:false}</script>
<script src="_t.js"></script>
